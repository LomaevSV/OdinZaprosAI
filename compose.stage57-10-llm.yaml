services:
  app:
    env_file:
      - /home/odin/odin-stage57-10/secrets/ofox.env
    environment:
      ODIN_LLM_MODE: "live"
      ODIN_LLM_BASE_URL: "https://api.ofox.ai/v1"
      ODIN_LLM_MODEL: "openai/gpt-5.4-mini"
      ODIN_LLM_RETRIES: "0"
      ODIN_LLM_HTTP_ATTEMPTS_PER_TURN: "2"
      ODIN_LLM_CALLS_PER_TURN: "2"
      ODIN_LLM_MAX_OUTPUT_TOKENS: "1024"
      ODIN_LLM_TIMEOUT_S: "10"
      ODIN_TURN_DEADLINE_S: "60"
