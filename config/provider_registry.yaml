# Реестр провайдеров API/MCP — карточки по PROVIDER-01 (ТЗ 0.7)
#
# ВАЖНО:
# - Утверждены (DEC-09, 25.10.2026): tutu_mcp (только чтение), open_meteo (геокодинг, климат), osrm_demo
#   (оценка времени). Остальные — `owner_decision: null`, `approval_status: proposed`.
# - Live-вызов разрешён только при `approval_status: approved`, который возникает лишь при
#   `owner_decision: approved` и записи руководителя в docs/decision_log.md (план §14.1).
# - `recommendation` — текстовое предложение разработчика, а НЕ право вызова.
# - `historical_probe_success` и `current_runtime_reachable` — независимые факты.
# - Источники фактов: ODIN_API_MCP_RESEARCH.md (handoff-3, пробы 23.10.2026), разовые пробы
#   из среды OpenCode 24.10.2026 (план v0.5.2, §1.4) и минимальная проба 25.10.2026 (DEC-11).
# - «нет данных» означает, что сведений нет, а не что ограничения отсутствуют.
# - Ключи и токены в этом файле не хранятся (SECURITY-01).

