# Базовая проверка (рекомендация организаторов): линтер, тесты и сборка Docker-образа.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.6"
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d && sleep 20 && curl -fsS http://localhost:8080/health
      - if: always()
        run: docker compose logs --no-color app && docker compose down
