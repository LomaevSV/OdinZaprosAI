# Манифест релиза (`release_manifest`) — ТЗ 0.7 §12, ACCEPT-01 п. 8
#
# Состояние на 28.10.2026: кандидат поставки — коммит подготовки поверх 67a9da9 (ветка integration/20261027).
# История срезов: docs/reports/S1…S8_REPORT.md; результаты этапов 59–63 — адресные тесты (см. README).

schema_version: "1.0.0"
application: odin-zapros
version: "0.2.0"
contracts_schema_version: "1.0.0"
release_kind: "кандидат финальной сдачи; блокеры ниже открыты"
date: "2026-10-28"

configuration_defaults:
  ODIN_DATA_MODE: auto        # без ключа LLM — mock (резерв); при настроенной LLM — live (без подмены на Mock)
  ODIN_LLM_MODE: "off"
  ODIN_PORT: 8080
  ODIN_OFFER_TTL_MINUTES: 30

data_modes:
  mock: "резервный режим без ключа: только ДЕМО с маркировкой"
  live: "Tutu MCP, Open-Meteo, OSRM (DEC-09); при сбое — Replay или честное «неизвестно»"
  mixed: "только по явной настройке: ДЕМО по компоненту с уведомлением в ответе (DEC-23)"
  replay: "снимки Live-ответов по строгому ключу, локально (DEC-24)"

providers_enabled: [tutu_mcp, open_meteo, osrm_demo]
providers_not_enabled: "nominatim, photon, ourairports, hotelscasa_mcp, met_norway, twogis_public_transport — proposed"

llm: >
  OpenAI-совместимый Chat Completions; включается оператором (ODIN_LLM_MODE=live + ключ, адрес, модель).
  Передаётся только текущее сообщение без секретов и персональных номеров; тексты не журналируются.

checks:
  pytest: "27.10: полный набор без tests/live — 893 passed; 28.10: адресные тесты этапов 59–63 — PASS, полный набор не перезапускался"
  ruff: "check и format --check без замечаний"
  schema_snapshot: "python -m odin.contracts.schema_export --check"
  openapi_snapshot: "python -m odin.openapi_snapshot --check"
  docker_clean_run: "BLOCKED до журнала запуска в отдельной среде (docs/DOCKER_CHECK.md, DEC-06)"
  docker_team_server: "28.10: изолированный контейнер healthy (data=live, llm=live) на сервере команды — не чистая сборка"
  llm_live: "28.10: реальная модель обработала запрос на сервере команды"

# Обязательные блокеры финальной сдачи («Правила по технике», DEC-32): без них сдача не выполнена.
submission_blockers:
  - id: demo_video
    status: open
    requirement: "ссылка на видео-скринкаст в README (доступна в режиме инкогнито)"
    owner: "руководитель проекта (после записи)"
  - id: docker_clean_run
    status: open
    requirement: "docker compose up --build в отдельной среде, журнал запуска"
  - id: submission_tag
    status: open
    requirement: "git-тег submission на последнем коммите основной ветки в репозитории организации"
  - id: default_branch
    status: open
    requirement: "рабочая версия в основной ветке: сейчас master отстаёт от integration/20261027"

known_limitations:
  - "наличие мест и номеров из поисковой выдачи — unknown; детские ж/д тарифы не запрашиваются"
  - "время трансфера — оценка OSRM без пробок; стоимость трансфера не оценивается (DEC-18)"
  - "стыки по буферам — unknown (DEC-20); TTL офферов 30 мин — provisional (DEC-21)"
  - "2ГИС, климатические нормы, OurAirports не подключены (DEC-12, DEC-13)"
  - "юридическая проверка поставки не выполнена (DEC-33, LEGAL-01)"
