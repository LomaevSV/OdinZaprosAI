# Манифест релиза (`release_manifest`) — ТЗ 0.7 §12, ACCEPT-01 п. 8
#
# Коммит релиза — локальный тег git `s6-2026-10-24` (DEC-05; push не выполняется без разрешения).
# Фактические результаты тестов и метрики — docs/reports/test_report.md и docs/reports/metrics.json.

schema_version: "1.0.0"
application: odin-zapros
version: "0.1.0"
contracts_schema_version: "1.0.0"
release_kind: "внутренний срез S6 (Mock); не финальная сдача (S7, DEC-32)"
date: "2026-10-24"

configuration_defaults:
  ODIN_DATA_MODE: mock
  ODIN_LLM_MODE: "off"
  ODIN_PORT: 8080
  ODIN_OFFER_TTL_MINUTES: 30

data_modes:
  mock: enabled
  replay: "готов маршрутизатор, снимков нет (DEC-24)"
  live: "BLOCKED: DEC-04, DEC-09, DEC-11"

providers_enabled:
  - id: odin_mock
    data_mode: mock
    note: "синтетические данные «ДЕМО»; см. docs/data_manifest.yaml"
providers_not_enabled: "все карточки config/provider_registry.yaml — approval_status=proposed (DEC-09)"

llm: "off (DEC-07); свободный диалог недоступен, используется структурированная форма (DEC-08)"

checks:
  pytest: "все уровни зелёные — см. docs/reports/test_report.md"
  ruff: "check и format --check без замечаний"
  schema_snapshot: "python -m odin.contracts.schema_export --check"
  openapi_snapshot: "python -m odin.openapi_snapshot --check"
  docker_clean_run: "BLOCKED: DEC-06 утверждён в варианте «внешней среды пока нет»"
  corpus: "K-01..K-30: Mock/Replay — по отчёту; Live — BLOCKED"

known_limitations:
  - "Live-данные, геокодинг, климатические нормы, 2ГИС не подключены (DEC-09, DEC-12, DEC-13)"
  - "доступность Mock всегда unknown; стоимость трансфера не оценивается (DEC-18), итог partial"
  - "стыки по неутверждённым буферам — unknown (DEC-20)"
  - "TTL офферов 30 мин — provisional (DEC-21); допущения о составе группы запрещены (DEC-25)"
  - "каталог вдохновения — 5 демо-направлений (DEC-28 открыт)"
  - "юридическая проверка поставки не выполнена (DEC-33, LEGAL-01)"

