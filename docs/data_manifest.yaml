schema_version: "1.0.0"
updated_at: "2026-10-25"

datasets:
  - id: odin_mock_generator
    status: included
    location: src/odin/tools/mock_data.py
    data_mode: mock
    origin: "синтетические данные, генерируются кодом детерминированно (seed из параметров запроса)"
    license: "код проекта"
    limitations: "не цены, не наличие, не расписание; названия «ДЕМО-…»; доступность всегда unknown"
    rights_confirmed: true

  - id: odin_demo_places
    status: included
    location: src/odin/tools/mock_data.py
    data_mode: mock
    origin: "демо-справочник: русские названия городов, приблизительные координаты центров и идентификаторы часовых поясов IANA (из базы tzdata)"
    license: "названия городов, координаты центров и идентификаторы IANA — общедоступные сведения; база tzdata — public domain"
    limitations: "8 городов; только для Mock-пути S1; город вне списка — честный отказ"
    rights_confirmed: true

  - id: odin_demo_catalog
    status: included
