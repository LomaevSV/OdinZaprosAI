    license: "текст проекта"
    limitations: "5 направлений (DEC-28 открыт); теги не проверены внешним источником; климат не загружен (DEC-12); визы не проверены; ДЕМО-оценка стоимости и времени пути считается кодом из Mock и всегда partial"
    rights_confirmed: true

